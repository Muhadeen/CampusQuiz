function about(){v.innerHTML=`<section class="nr"><h2>About CampusQuiz</h2>
<p>CampusQuiz began with a simple observation: students love testing themselves, and almost nobody makes it easy.</p>
<h3>Where it started</h3><p>In level 100, our lecturers sent out quizzes on Google Forms. Students actually enjoyed them. They compared scores, argued over answers and went back to read what they got wrong. Then campaign season arrived, and we watched aspirants do the opposite: type out past questions, save them as PDFs and forward them across WhatsApp groups. Students got no score and no feedback, and most of those files were never opened. The effort was real. The result was lost.</p>
<h3>What we wanted to fix</h3><p>Past questions are something students genuinely want, and an aspirant who shares them gets attention at the right moment. So we asked a simple question: what if one link could do both jobs? The student gets a real quiz with instant answers. The aspirant gets their flyer, policies and contact details in front of every person who takes it.</p>
<h3>What we believe</h3><p><b>Campaigns should be about ideas.</b> A quiz is a friendly way to introduce yourself and your plans.</p><p><b>Students come first.</b> Taking a quiz needs no account, and name, phone and email are always optional.</p><p><b>Pricing should be fair.</b> A hall or departmental aspirant should be able to afford this as easily as an SRC campaign.</p>
<h3>Where we are going</h3><p>CampusQuiz is built in Ghana for Ghanaian campuses, and it is still growing. We add features based on what aspirants and students tell us. If something doesn't work for you, <a href="#/contact">tell us</a>. It shapes what we build next.</p></section>`}

function privacy(){v.innerHTML=`<section class="nr"><h2>Privacy Policy</h2><p class="sm">Last updated: November 2026</p><p>This policy explains what CampusQuiz collects, why, who can see it, and what you can do about it. We aim to handle personal data in line with Ghana's Data Protection Act, 2012 (Act 843).</p>
<h3>1. Who this covers</h3><p><b>Aspirants</b> create an account and publish quizzes. <b>Students</b> open a quiz link or QR code and take it. Students never need an account.</p>
<h3>2. What we collect</h3><p><b>From aspirants:</b> name, email and password (handled by Google Firebase Authentication; we cannot read it), plus your quizzes, uploaded flyer and question images, policies, contact details and PDF text you turn into questions. Uploaded PDFs are read in your browser and are not stored.</p><p><b>Payment records:</b> the transaction ID, amount and plan you submit. We never see your mobile money PIN or card details.</p><p><b>From students:</b> every answer, your score, the time you submitted, and a name, phone and email only if you choose to type them.</p><p><b>Technical data:</b> a login session for aspirants. Google may log basic technical data such as IP address.</p>
<h3>3. Why we use it</h3><p>To run accounts, show quizzes, grade answers, give aspirants their responses, verify payments, review quizzes against our terms, prevent misuse and answer messages. We do not sell personal data or use it for advertising.</p>
<h3>4. Who can see what</h3><p><b>Anyone with the link or QR code</b> can see a published quiz, including the flyer, policies and contacts. Do not publish anything private.</p><p><b>Aspirants</b> can see the responses to their own quizzes, including any name, phone or email a student gave and exactly how they answered. Aspirants must use this only for their campaign and must not misuse or share it.</p><p><b>CampusQuiz administrators</b> can see accounts, quizzes, responses and payment records to verify payments, review content and give support.</p>
<h3>5. Where data is stored</h3><p>On Google Firebase, which may process data on servers outside Ghana. No online service can promise perfect security.</p>
<h3>6. How long we keep it</h3><p>While your account is active. Payment records are kept as long as needed for accounting and disputes. You can ask us to delete your data at any time.</p>
<h3>7. Your rights</h3><p>You may ask to see, correct or delete your personal data, or withdraw consent for optional details. <a href="#/contact">Contact us</a>. Students can simply leave optional fields blank.</p>
<h3>8. Children</h3><p>CampusQuiz is for tertiary students and adults. If someone under 18 has given us personal data, contact us and we will remove it.</p>
<h3>9. Changes</h3><p>We may update this policy. The date above shows the latest version.</p>
<h2 style="margin-top:34px">Terms of Use</h2>
<h3>Your content</h3><p>You are responsible for the questions, flyers, policies and contact details you publish and confirm you have the right to share them. We may review any quiz. Content that is unlawful, abusive, defamatory, misleading or breaks these terms can be removed without notice, and accounts may be suspended.</p>
<h3>Fair use</h3><p>Do not collect students' details for anything other than your campaign. Do not try to access other people's accounts or data or interfere with the service.</p>
<h3>Access and payments</h3><p>Your first quiz is free. Further quizzes need paid access, which we switch on after we confirm your payment. Please <a href="#/contact">contact us</a> about any payment problem.</p>
<h3>Prices</h3><p>Prices may change, and will increase during massive campaign periods.</p>
<h3>Availability</h3><p>We work to keep CampusQuiz running but cannot promise it will never be interrupted. Grading happens in the student's browser, so we cannot guarantee scores are tamper-proof.</p>
<h3>Responsibility</h3><p>CampusQuiz is a tool for sharing quizzes. We are not responsible for election outcomes or for what aspirants publish.</p></section>`}

/* ---------- student quiz ---------- */
const norm=s=>String(s??"").toLowerCase().replace(/[^a-z0-9. \-]/g,"").replace(/\s+/g," ").trim();
const grade=(q,a)=>q.t=="essay"?null:q.t=="fill"?q.k.split("|").map(norm).filter(Boolean).includes(norm(a)):a===q.a;
const lab=(q,a)=>q.t=="fill"||q.t=="essay"?(String(a||"").trim()||"No answer"):(a>=0&&q.o[a]!=null?(q.t=="mcq"?"ABCDEFGH"[a]+". ":"")+q.o[a]:"No answer");
const corr=q=>q.t=="fill"?q.k.split("|")[0].trim():lab(q,q.a);
function rev(q,a,i){const r=grade(q,a);return`<div class="rq ${r===null?"":r?"k":"x"}"><b>${i+1}. ${E(q.q)}</b>${okImg(q.im)?`<br><img src="${q.im}" alt="">`:""}<p style="margin:6px 0">Answer given: <b>${E(lab(q,a))}</b> ${r===null?'<span class="chip">Not graded</span>':r?'<span class="chip ok">✓ Correct</span>':'<span class="chip bad">✗ Wrong</span>'}</p>${r===false?`<p style="margin:4px 0">Correct answer: <b>${E(corr(q))}</b></p>`:""}${q.t=="essay"&&q.k?`<p style="margin:4px 0">Sample answer: <b>${E(q.k)}</b></p>`:""}${q.fb&&r===false?`<p class="sm">💡 ${E(q.fb)}</p>`:""}</div>`}
async function quiz(id){v.innerHTML='<div class="w">Loading…</div>';let x;try{const s=await getDoc(doc(db,"quizzes",id));if(!s.exists())throw 0;x=s.data()}catch(e){v.innerHTML='<section class="nr"><h2>Quiz not found 😕</h2><p>It may have been removed. Check the link or ask whoever shared it.</p></section>';return}qpage(id,x,{})}
function qpage(id,x,d){clearInterval(T);const f=x.fl||{};
v.innerHTML=`<div class="w" style="max-width:980px"><div class="cols"><div class="card fly">${okImg(f.img)?`<img src="${f.img}" alt="Campaign flyer">`:""}${f.who?`<h2>${E(f.who)}</h2>`:""}<b>${E(f.role)}</b>${f.con?`<p style="margin-top:8px">📞 ${E(f.con)}</p>`:""}</div>${f.pol?`<div class="card pol"><h3 style="margin-top:0">📜 My policies</h3><p style="white-space:pre-line">${E(f.pol)}</p></div>`:""}</div>
<div class="card"><h2>${E(x.name||x.code)}${x.code&&x.name?" ("+E(x.code)+")":""}${x.parts>1?" · Part "+x.part+" of "+x.parts:""}</h2><p><span class="chip">${x.q.length} questions</span> ${x.timer?`<span class="chip bad">⏱ ${x.timer} min timer</span>`:""}</p>${x.guide?`<p><b>How to answer:</b> ${E(x.guide)}</p>`:""}${x.about?`<p>${E(x.about)}</p>`:""}<h3>Your details (optional)</h3><div class="row"><input id="sn" placeholder="Full name" value="${E(d.n)}"><input id="sp" placeholder="Phone" value="${E(d.p)}"><input id="se" placeholder="Email" value="${E(d.e)}"></div><button class="btn big c" id="go">▶ Start quiz</button>${x.timer?'<p class="sm">The timer starts when you tap Start. If time runs out, your answers submit automatically.</p>':""}</div></div>`;
g("go").onclick=()=>{d={n:g("sn").value,p:g("sp").value,e:g("se").value};qrun(id,x,d)}}
function qrun(id,x,d){scrollTo(0,0);const N=x.q.length;
v.innerHTML=`<div class="w" style="max-width:760px"><div class="bar" id="bar"><span id="tm">${x.timer?"⏱ --:--":"Good luck 🍀"}</span><span id="pg">0/${N} answered</span><div class="pgb"><i id="pgi"></i></div></div><form id="qf" onsubmit="return false">${x.q.map((q,i)=>{const t=q.t||"mcq";return`<div class="qq"><b>${i+1}. ${E(q.q)}</b>${okImg(q.im)?`<br><img src="${q.im}" alt="">`:""}<div style="margin-top:6px">`+(t=="fill"?`<input id="a${i}" placeholder="Type your answer" autocomplete="off">`:t=="essay"?`<textarea id="a${i}" placeholder="Write your answer"></textarea>`:q.o.map((o,j)=>`<label><input type="radio" name="a${i}" value="${j}">${t=="mcq"?"ABCDEFGH"[j]+". ":""}${E(o)}</label>`).join(""))+`</div></div>`}).join("")}</form><button class="btn big c" id="sb">Submit answers</button></div>`;
const val=i=>{const t=x.q[i].t;return t=="fill"||t=="essay"?g("a"+i).value:+(document.querySelector(`input[name=a${i}]:checked`)?.value??-1)},have=i=>{const a=val(i);return typeof a=="string"?a.trim()!=="":a>=0};
const upd=()=>{const n=x.q.filter((_,i)=>have(i)).length;g("pg").textContent=n+"/"+N+" answered";g("pgi").style.width=n/N*100+"%"};g("qf").addEventListener("input",upd);g("qf").addEventListener("change",upd);
const submit=async late=>{clearInterval(T);if(!late&&x.q.some((_,i)=>!have(i))&&!confirm("Some questions are unanswered. Submit anyway?"))return;
const ans=x.q.map((_,i)=>val(i));let n=0,tot=0;x.q.forEach((q,i)=>{const r=grade(q,ans[i]);if(r!==null){tot++;if(r)n++}});
const rec={quiz:id,owner:x.owner,qname:x.name||x.code||"",score:n,total:tot,pct:tot?Math.round(n/tot*100):0,name:d.n||"",phone:d.p||"",email:d.e||"",answers:ans,late:!!late,at:Date.now()};
g("sb").disabled=true;try{await addDoc(collection(db,"results"),rec)}catch(e){}done(id,x,d,rec)};
g("sb").onclick=()=>submit(false);
if(x.timer){let left=x.timer*60;const tick=()=>{const m=Math.floor(left/60),s=left%60;g("tm").textContent="⏱ "+m+":"+String(s).padStart(2,"0");g("bar").classList.toggle("low",left<=60);if(left--<=0)submit(true)};tick();T=setInterval(tick,1000)}}
function done(id,x,d,rec){scrollTo(0,0);const m=rec.pct>=80?"Brilliant! 🎉":rec.pct>=50?"Nice work! 👏":"Keep going, you'll get there 💪";
v.innerHTML=`<div class="w" style="max-width:760px"><div class="card" style="text-align:center"><h2>${m}</h2>${rec.late?'<p><span class="chip bad">⏱ Time was up, so your answers were submitted automatically</span></p>':""}<div class="ring" style="--p:${rec.pct}"><b>${rec.pct}%</b></div><p>You got <b>${rec.score}</b> out of <b>${rec.total}</b> graded questions right.</p><button class="btn" id="rt">🔁 Try again</button><button class="btn o" id="nr">➕ Submit another response</button></div><h3>Your answers</h3>${x.q.map((q,i)=>rev(q,rec.answers[i],i)).join("")}</div>`;
g("rt").onclick=()=>qpage(id,x,d);g("nr").onclick=()=>qpage(id,x,{});if(rec.pct>=70)confetti()}

async function resp(id){v.innerHTML='<div class="w">Loading…</div>';let x;try{const s=await getDoc(doc(db,"quizzes",id));x=s.exists()?s.data():null}catch(e){}
if(!x||(x.owner!==me.uid&&!isAdm())){v.innerHTML='<div class="nr"><h2>Not available</h2><p>This quiz was removed or isn\'t yours.</p></div>';return}
let R=[];try{const s=await getDocs(query(collection(db,"results"),where("quiz","==",id),where("owner","==",x.owner)));R=s.docs.map(d=>d.data()).sort((a,b)=>b.at-a.at)}catch(e){v.innerHTML='<div class="nr"><h2>Couldn\'t load responses</h2><p>'+E(e.message)+'</p></div>';return}
let tab="ov",ix=0;const n=R.length,av=n?Math.round(R.reduce((t,r)=>t+r.pct,0)/n):0,hi=n?Math.max(...R.map(r=>r.pct)):0,lo=n?Math.min(...R.map(r=>r.pct)):0;
const ov=()=>x.q.map((q,i)=>{const A=R.map(r=>r.answers?.[i]);let b="";
if(q.t=="mcq"||q.t=="tf"){const c=q.o.map((_,j)=>A.filter(a=>a===j).length),sk=A.filter(a=>a==null||a===-1).length;b=q.o.map((o,j)=>`<div>${E(o)} ${j===q.a?'<span class="chip ok">✓ correct</span>':""} <b>${c[j]}</b> (${n?Math.round(c[j]/n*100):0}%)<div class="bar2"><i class="${j===q.a?"k":""}" style="width:${n?c[j]/n*100:0}%"></i></div></div>`).join("")+(sk?`<p class="sm">${sk} skipped</p>`:"")}
else{const m=new Map();A.filter(a=>String(a||"").trim()).forEach(a=>{const k=norm(a)||a,e=m.get(k)||{t:a,n:0};e.n++;m.set(k,e)});b=m.size?[...m.values()].map(e=>`<p style="margin:4px 0">${q.t=="fill"?(grade(q,e.t)?'<span class="chip ok">✓</span> ':'<span class="chip bad">✗</span> '):""}${E(e.t)} <span class="sm">× ${e.n}</span></p>`).join(""):'<p class="sm">No answers yet.</p>';if(q.t=="fill")b+=`<p class="sm">Accepted: ${E(q.k)}</p>`}
return`<div class="rq"><b>${i+1}. ${E(q.q)}</b><div style="margin-top:8px">${b}</div></div>`}).join("");
const draw=()=>{const r=R[ix];v.innerHTML=`<div class="w">${isAdm()?'<a href="#/adm/quizzes">← Back to quizzes</a>':appnav("mine")}<h2>📊 ${E(x.name||x.code)}${x.parts>1?" · Part "+x.part:""}</h2>
<div class="stats"><div class="stat"><b>${n}</b>Responses</div><div class="stat"><b>${av}%</b>Average</div><div class="stat"><b>${hi}%</b>Highest</div><div class="stat"><b>${lo}%</b>Lowest</div></div>
${n?`<div class="seg"><button data-t="ov" class="${tab=="ov"?"on":""}">All together</button><button data-t="in" class="${tab=="in"?"on":""}">One by one</button></div>`+(tab=="ov"?ov():`<div class="cols" style="grid-template-columns:240px 1fr"><div class="card" style="max-height:520px;overflow:auto;padding:10px">${R.map((q,k)=>`<button class="btn s ${k==ix?"":"o"}" data-i="${k}" style="width:100%;text-align:left;margin:0 0 6px">${E(q.name||"Anonymous")} · ${q.pct}%</button>`).join("")}</div><div><div class="card"><h3 style="margin:0">${E(r.name||"Anonymous")} <span class="chip">${r.pct}% · ${r.score}/${r.total}</span></h3><p class="sm" style="margin:4px 0">${fmt(r.at)}${r.phone?" · 📞 "+E(r.phone):""}${r.email?" · ✉️ "+E(r.email):""}${r.late?" · ⏱ auto-submitted":""}</p><button class="btn s o" id="pv" ${ix==0?"disabled":""}>← Newer</button><button class="btn s o" id="nx" ${ix==n-1?"disabled":""}>Older →</button><span class="sm">${ix+1} of ${n}</span></div>${x.q.map((q,i)=>rev(q,r.answers?.[i],i)).join("")}</div></div>`):`<div class="card" style="text-align:center"><div style="font-size:3rem">📭</div><p>No responses yet. Share your link or QR code!</p></div>`}</div>`;
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{ix=+b.dataset.i;draw()});if(g("pv")){g("pv").onclick=()=>{ix--;draw()};g("nx").onclick=()=>{ix++;draw()}}};draw()}

put(`<h2>Payments</h2><div class="card"><h3 style="margin-top:0">Waiting</h3>${pe.length?pe.map(p=>`<div class="rq"><b>${E(p.name||p.email)}</b> · ${E(p.email)}<br>${E(p.plan)} · GHS ${E(p.amount)} · ID <b>${E(p.txid)}</b> · ${fmt(p.at)}<br><button class="btn s" data-a="${p.id}" data-u="${p.uid}">✅ Confirm &amp; switch access on</button><button class="btn s o" data-r="${p.id}">Reject</button></div>`).join(""):"<p>Nothing waiting.</p>"}</div><div class="card"><h3 style="margin-top:0">History</h3><table>${ps.filter(p=>p.status!="pending").map(p=>`<tr><td>${E(p.email)}<td>${E(p.plan)}<td>GHS ${E(p.amount)}<td>${E(p.status)}`).join("")}</table></div>`);
main.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.u),{access:true});await updateDoc(doc(db,"payments",b.dataset.a),{status:"approved"});toast("Access switched on");adm("pay")});
main.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"payments",b.dataset.r),{status:"rejected"});adm("pay")})}
else if(a=="prices"){put(`<h2>Prices</h2><div class="card"><label>Notice shown on the pricing page</label><input id="an" value="${E(P.note)}">${P.plans.map((p,i)=>`<div class="rq"><div class="row"><div><label>Name</label><input id="pn${i}" value="${E(p.name)}"></div><div><label>Price (GHS)</label><input id="pc${i}" type="number" value="${E(p.price)}"></div><div><label>Per</label><input id="pr${i}" value="${E(p.per)}"></div></div><label>Features (one per line)</label><textarea id="pf${i}" style="min-height:80px">${E(p.feat.join("\n"))}</textarea></div>`).join("")}<button class="btn" id="sp">Save prices</button></div>`);
g("sp").onclick=async()=>{const pl=P.plans.map((p,i)=>({id:p.id,name:g("pn"+i).value,price:+g("pc"+i).value,per:g("pr"+i).value,feat:g("pf"+i).value.split("\n").map(s=>s.trim()).filter(Boolean)}));await setDoc(doc(db,"settings","prices"),{plans:pl,note:g("an").value});P={plans:pl,note:g("an").value};toast("Prices saved")}}
}catch(e){put('<div class="card"><p class="er">'+E(e.message)+'</p></div>')}}

/* ---------- router ---------- */
function route(){clearInterval(T);const[p,a]=location.hash.slice(2).split("/");scrollTo(0,0);
document.body.classList.toggle("adm",!!me&&isAdm()&&(p=="adm"||p=="chk"));
if(["app","new","mine","pay","adm","resp","chk"].includes(p)&&!me){location.hash="#/login";return}
if(p=="adm"&&!isAdm()){location.hash="#/app";return}
const R={"":home,pricing,about,faq,contact,privacy,login,app:welcome,new:builder,mine,pay,adm:()=>adm(a||"")};
p=="q"?quiz(a):p=="resp"?resp(a):p=="chk"?chk(a):(R[p]||home)();rv()}
addEventListener("hashchange",route);
onAuthStateChanged(auth,async u=>{me=u;prof=null;if(u){try{const r=doc(db,"users",u.uid),s=await getDoc(r);if(!s.exists()){const d=pend||{name:(u.email||"").split("@")[0],email:u.email,access:false,trialUsed:false,at:Date.now()};await setDoc(r,d);prof=d}else prof=s.data()}catch(e){prof=pend}}
pend=null;await loadP();nav();const p=location.hash.slice(2).split("/")[0];if(u&&(p===""||p=="login"))location.hash=isAdm()?"#/adm":"#/app";else route()});
</script></body></html>
