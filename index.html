<section><h2>How it works</h2><div class="g"><div class="c rv"><div class="e">📝</div><h3>Add your questions</h3><p>Paste your past questions. We turn them into a quiz and split long sets into parts of 50.</p></div><div class="c rv"><div class="e">📣</div><h3>Add your campaign</h3><p>Your flyer, policies and contact details sit at the top of every quiz.</p></div><div class="c rv"><div class="e">🔗</div><h3>Share the link</h3><p>Students open it on their phones, take the quiz and see their answers.</p></div></div></section>

function about(){v.innerHTML=`<section class="nr"><h2>About CampusQuiz</h2>
<p>CampusQuiz began with a simple observation: students love testing themselves, and almost nobody makes it easy.</p>
<h3>Where it started</h3>
<p>In level 100, our lecturers sent out quizzes on Google Forms. Students actually enjoyed them. They compared scores, argued over answers and went back to read what they got wrong. Then campaign season arrived, and we watched aspirants do the opposite: type out past questions, save them as PDFs and forward them across WhatsApp groups. Students got no score and no feedback, and most of those files were never opened. The effort was real. The result was lost.</p>
<h3>What we wanted to fix</h3>
<p>Past questions are something students genuinely want, and an aspirant who shares them gets attention at the right moment. So we asked a simple question: what if one link could do both jobs? The student gets a real quiz with instant answers. The aspirant gets their flyer, policies and contact details in front of every person who takes it.</p>
<h3>What we believe</h3>
<p><b>Campaigns should be about ideas.</b> A quiz is a friendly way to introduce yourself and your plans.</p>
<p><b>Students come first.</b> Taking a quiz needs no account, and name, phone and email are always optional.</p>
<p><b>Pricing should be fair.</b> A hall or departmental aspirant should be able to afford this as easily as an SRC campaign.</p>
<h3>Where we are going</h3>
<p>CampusQuiz is built in Ghana for Ghanaian campuses, and it is still growing. We add features based on what aspirants and students tell us. If something doesn't work for you, <a href="#/contact">tell us</a>. It shapes what we build next.</p></section>`}

function privacy(){v.innerHTML=`<section class="nr"><h2>Privacy Policy</h2><p class="sm">Last updated: November 2026</p>
<p>This policy explains what CampusQuiz collects, why, who can see it, and what you can do about it. We aim to handle personal data in line with Ghana's Data Protection Act, 2012 (Act 843).</p>
<h3>1. Who this covers</h3><p><b>Aspirants</b> are people who create an account and publish quizzes. <b>Students</b> are people who open a quiz link and take it. Students never need an account.</p>
<h3>2. What we collect</h3>
<p><b>From aspirants:</b> your name, email address and password (the password is handled by Google Firebase Authentication, and we cannot read it). We also store your plan and expiry date, the quizzes you publish, and your campaign content: flyer link, policies and contact details.</p>
<p><b>Payment records:</b> the transaction ID, amount, plan and date you submit. We never see your mobile money PIN or card details, because payment happens outside this site.</p>
<p><b>From students:</b> your answers and score for each quiz. Name, phone number and email are collected only if you choose to type them in.</p>
<p><b>Technical data:</b> your browser keeps a login session if you are an aspirant. Google may log basic technical data such as IP address when you use Firebase services.</p>
<h3>3. Why we use it</h3><p>We use your data to run your account, show your quizzes, grade answers, give aspirants their results, verify payments, prevent misuse and answer your messages. We do not sell personal data, and we do not use it for advertising.</p>
<h3>4. Who can see what</h3>
<p><b>Everyone with the link</b> can see a published quiz page, including the flyer, policies and contact details the aspirant added. Do not put anything private there.</p>
<p><b>Aspirants</b> can see the results of their own quizzes, which include any name, phone or email a student chose to enter. Aspirants must use that information only for their campaign and must not misuse or share it.</p>
<p><b>CampusQuiz administrators</b> can see accounts, plans and payment records so we can verify payments and give support.</p>
<h3>5. Where data is stored</h3><p>Data is stored on Google Firebase, which may process it on servers outside Ghana. Google provides security protections, but no online service can promise perfect security.</p>
<h3>6. How long we keep it</h3><p>We keep account and quiz data while your account is active. Payment records are kept as long as needed for accounting and dispute handling. You can ask us to delete your data at any time.</p>
<h3>7. Your rights</h3><p>You may ask to see, correct or delete the personal data we hold about you, or withdraw consent for optional details you gave. <a href="#/contact">Contact us</a> and we will respond as quickly as we can. Students can also simply leave the optional fields blank.</p>
<h3>8. Children</h3><p>CampusQuiz is meant for tertiary students and adults. If you believe someone under 18 has given us personal data, contact us and we will remove it.</p>
<h3>9. Changes</h3><p>We may update this policy. The date at the top shows the latest version. Continued use means you accept the update.</p>
<h2 style="margin-top:34px">Terms of Use</h2>
<h3>Your content</h3><p>You are responsible for the questions, flyers, policies and contact details you publish, and you confirm you have the right to share them. Content that is unlawful, abusive, defamatory or misleading may be removed without notice, and accounts may be suspended.</p>
<h3>Fair use</h3><p>Do not collect students' details for any purpose other than your campaign. Do not try to access other people's accounts or data, or interfere with the service.</p>
<h3>Payments and plans</h3><p>Plans are paid by mobile money or bank transfer and start after we verify the payment. Expired plans return to the Free Trial. Please <a href="#/contact">contact us</a> about any payment problem.</p>
<h3>Prices</h3><p>Prices may change, and will increase during massive campaign periods. A plan you have already paid for keeps its price until it expires.</p>
<h3>Availability</h3><p>We work to keep CampusQuiz running but cannot promise it will never be interrupted. Quiz grading happens in the student's browser, so we cannot guarantee that scores are tamper-proof.</p>
<h3>Responsibility</h3><p>CampusQuiz is a tool for sharing quizzes. We are not responsible for election outcomes or for what aspirants publish.</p></section>`}

function builder(){g("bld").innerHTML=`<div class="c" style="margin-top:18px"><h3>Create a quiz</h3><div class="row"><div><label>Course name</label><input id="cn"></div><div><label>Course code</label><input id="cc"></div></div><label>How to answer (guidelines)</label><textarea id="gd" style="min-height:70px"></textarea><label>About this quiz</label><textarea id="ds" style="min-height:70px"></textarea><h3>Your campaign</h3><div class="row"><div><label>Your name</label><input id="fw"></div><div><label>Position</label><input id="fr"></div></div><label>Flyer image link (optional)</label><input id="fi" placeholder="https://"><label>Your policies</label><textarea id="fp" style="min-height:90px"></textarea><label>Contact details</label><input id="fc"><h3>Questions</h3><p class="sm">Paste numbered questions. Options A to D make a multiple choice question, a blank like ____ makes a fill-in question, and a question with no options becomes an essay. Add a line like "Answer: B" or "Answer: opportunity cost" under a question to set its answer. You can change each type after.</p><textarea id="qt"></textarea><button class="btn" id="bq">Build questions</button><div id="qs"></div></div>`;g("bq").onclick=review}
function fin(c){const r=(c.r||"").trim();if(c.o.length>1){const t=c.o.map(x=>x.toLowerCase().trim());if(t.length==2&&t.includes("true")&&t.includes("false")){c.t="tf";c.o=["True","False"];const L=/^[a-h]$/i.test(r)?r.toUpperCase().charCodeAt(0)-65:-1;c.a=L>=0?(t[L]=="true"?0:1):(r?(/^t/i.test(r)?0:1):-1)}else{c.t="mcq";c.a=/^[a-h]$/i.test(r)?r.toUpperCase().charCodeAt(0)-65:-1}}else if(!c.o.length&&/^(true|false)$/i.test(r)){c.t="tf";c.o=["True","False"];c.a=/^t/i.test(r)?0:1}else if(/_{3,}/.test(c.q)||r){c.t="fill";c.k=r}else{c.t="essay"}}
function parse(t){const qs=[];let c=null,m;for(let l of t.split(/\r?\n/)){l=l.trim();if(!l)continue;if(m=l.match(/^ans(?:wer)?\s*[:\-]\s*(.+)/i)){if(c)c.r=m[1]}else if(m=l.match(/^\(?([A-Ha-h])\s*[.)]\s*(.+)/)){if(c)c.o.push(m[2])}else if(m=l.match(/^(\d+)\s*[.)]\s*(.+)/)){c={q:m[2],o:[],a:-1,fb:"",r:"",k:""};qs.push(c)}else if(c){if(c.o.length)c.o[c.o.length-1]+=" "+l;else c.q+=" "+l}}qs.forEach(fin);return qs}
const TY={mcq:"Multiple choice",tf:"True or false",fill:"Fill in the blank",essay:"Essay (not graded)"};
function sh(i){const t=g("ty"+i).value;g("mc"+i).style.display=t=="mcq"?"":"none";g("tf"+i).style.display=t=="tf"?"":"none";g("kk"+i).style.display=t=="fill"||t=="essay"?"":"none";g("k"+i).placeholder=t=="fill"?"Accepted answers, separate with |":"Sample answer shown after submit (optional)"}
function review(){QS=parse(g("qt").value);if(!QS.length){g("qs").innerHTML='<p class="er">No questions found. Number each question (1. or 1)).</p>';return}
g("qs").innerHTML=`<p><b>${QS.length} questions found.</b> Check the type of each one and set its answer. Feedback is optional.</p>`+QS.map((q,i)=>`<div class="q"><b>${i+1}. ${E(q.q)}</b><select id="ty${i}">${Object.keys(TY).map(k=>`<option value="${k}" ${q.t==k?"selected":""}>${TY[k]}</option>`).join("")}</select><div id="mc${i}">${q.o.map((o,j)=>`<label><input type="radio" name="r${i}" value="${j}" ${q.t=="mcq"&&q.a==j?"checked":""}>${"ABCDEFGH"[j]}. ${E(o)}</label>`).join("")}</div><div id="tf${i}">${["True","False"].map((o,j)=>`<label><input type="radio" name="f${i}" value="${j}" ${q.t=="tf"&&q.a==j?"checked":""}>${o}</label>`).join("")}</div><div id="kk${i}"><input id="k${i}" value="${E(q.k)}"></div><input id="im${i}" placeholder="Image link for this question (optional)"><input id="fb${i}" placeholder="Feedback shown when wrong (optional)"></div>`).join("")+`<p id="pe" class="er"></p><button class="btn" id="pu">Publish quiz</button><div id="lk"></div>`;
QS.forEach((q,i)=>{g("ty"+i).onchange=()=>sh(i);sh(i)});g("pu").onclick=publish}
async function publish(){const n=g("cn").value.trim(),c=g("cc").value.trim(),pe=g("pe");if(!n&&!c)return pe.textContent="Enter the course name or code.";
const out=[];for(let i=0;i<QS.length;i++){const q=QS[i],t=g("ty"+i).value,o={t,q:q.q,fb:g("fb"+i).value.trim(),im:g("im"+i).value.trim()};
if(t=="mcq"){const r=document.querySelector(`input[name=r${i}]:checked`);if(q.o.length<2)return pe.textContent="Question "+(i+1)+" needs at least two options, or change its type.";if(!r)return pe.textContent="Pick the correct answer for question "+(i+1)+".";o.o=q.o;o.a=+r.value}
else if(t=="tf"){const r=document.querySelector(`input[name=f${i}]:checked`);if(!r)return pe.textContent="Pick True or False for question "+(i+1)+".";o.o=["True","False"];o.a=+r.value}
else{o.k=g("k"+i).value.trim();if(t=="fill"&&!o.k)return pe.textContent="Enter the accepted answer for question "+(i+1)+"."}
out.push(o)}
try{const l=eff().limit;if(l){const s=await getDocs(query(collection(db,"quizzes"),where("owner","==",me.uid)));if(new Set(s.docs.map(d=>d.data().base)).size>=l)return pe.textContent="You have reached your plan limit of "+l+" course(s). Upgrade to add more."}
const base=slug(n,c),N=Math.ceil(out.length/50),ids=[];
for(let i=0;i<N;i++){const id=N>1?base+"-p"+(i+1):base;await setDoc(doc(db,"quizzes",id),{owner:me.uid,base,name:n,code:c,part:i+1,parts:N,guide:g("gd").value,about:g("ds").value,fl:{who:g("fw").value,role:g("fr").value,img:g("fi").value,pol:g("fp").value,con:g("fc").value},q:out.slice(i*50,i*50+50),at:Date.now()});ids.push(id)}
g("lk").innerHTML="<p><b>Published. Share these links:</b></p>"+ids.map(id=>`<p><a href="#/q/${id}">${location.origin+location.pathname}#/q/${id}</a></p>`).join("");mine()}catch(e){pe.textContent=e.message}}
async function mine(){try{const[a,b]=await Promise.all([getDocs(query(collection(db,"quizzes"),where("owner","==",me.uid))),getDocs(query(collection(db,"results"),where("owner","==",me.uid)))]);const st={};b.docs.forEach(d=>{const r=d.data();if(r.total)(st[r.quiz]??=[]).push(r.score/r.total)});
g("mine").innerHTML='<h3 style="margin-top:22px">Your quizzes</h3>'+(a.docs.length?`<table><tr><th>Quiz<th>Takers<th>Average<th>Link</tr>${a.docs.map(d=>{const x=d.data(),s=st[d.id]||[];return`<tr><td>${E(x.name||x.code)}${x.parts>1?" (Part "+x.part+")":""}<td>${s.length}<td>${s.length?Math.round(s.reduce((p,c)=>p+c,0)/s.length*100)+"%":"-"}<td><a href="#/q/${d.id}">Open</a>`}).join("")}</table>`:"<p>No quizzes yet. Create your first one above.</p>")}catch(e){}}
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9. \-]/g,"").replace(/\s+/g," ").trim();
const qh=(q,i)=>{const t=q.t||"mcq";return`<div class="q" id="q${i}">${q.im?`<img src="${E(q.im)}" alt="" style="max-width:100%;border-radius:10px;margin-bottom:8px">`:""}<b>${i+1}. ${E(q.q)}</b>`+(t=="fill"?`<input id="a${i}" placeholder="Type your answer">`:t=="essay"?`<textarea id="a${i}" placeholder="Write your answer"></textarea>`:q.o.map((o,j)=>`<label><input type="radio" name="a${i}" value="${j}">${t=="mcq"?"ABCDEFGH"[j]+". ":""}${E(o)}</label>`).join(""))+`<div class="sm" id="m${i}"></div></div>`};
async function quiz(id){v.innerHTML='<div class="w">Loading...</div>';let x;try{const s=await getDoc(doc(db,"quizzes",id));if(!s.exists())throw 0;x=s.data()}catch(e){v.innerHTML='<section class="nr"><h2>Quiz not found</h2><p>Check the link or ask the person who shared it with you.</p></section>';return}
const f=x.fl||{};v.innerHTML=`<div class="w" style="max-width:760px"><div class="fl">${f.img?`<img src="${E(f.img)}" alt="">`:""}<h2>${E(f.who)}</h2><b>${E(f.role)}</b>${f.pol?`<p style="white-space:pre-line;margin-top:10px">${E(f.pol)}</p>`:""}${f.con?`<p><b>${E(f.con)}</b></p>`:""}</div><h2 style="margin-top:26px">${E(x.name||x.code)}${x.code&&x.name?" ("+E(x.code)+")":""}${x.parts>1?", Part "+x.part+" of "+x.parts:""}</h2>${x.guide?`<p><b>How to answer:</b> ${E(x.guide)}</p>`:""}${x.about?`<p>${E(x.about)}</p>`:""}<div class="c"><b>Your details (optional)</b><input id="sn" placeholder="Full name"><input id="sp" placeholder="Phone"><input id="se" placeholder="Email"></div>${x.q.map((q,i)=>qh(q,i)).join("")}<button class="btn" id="sb">Submit answers</button><p id="sc" style="font-size:1.3rem;font-weight:800;color:var(--n)"></p></div>`;
g("sb").onclick=async()=>{let n=0,tot=0;x.q.forEach((q,i)=>{const t=q.t||"mcq",el=g("q"+i),m=g("m"+i);
if(t=="essay"){m.innerHTML=q.k?`Sample answer: <b>${E(q.k)}</b>`:"This question is not graded.";return}
tot++;let k=0,ans="";
if(t=="fill"){k=q.k.split("|").map(norm).filter(Boolean).includes(norm(g("a"+i).value));ans=q.k.split("|")[0].trim()}
else{const r=document.querySelector(`input[name=a${i}]:checked`);k=!!r&&+r.value==q.a;ans=(t=="mcq"?"ABCDEFGH"[q.a]+". ":"")+q.o[q.a]}
if(k)n++;el.className="q "+(k?"k":"x");m.innerHTML=k?"Correct":`Correct answer: <b>${E(ans)}</b>${q.fb?"<br>"+E(q.fb):""}`});
g("sc").textContent=`You scored ${n} out of ${tot}`;g("sb").disabled=true;try{await addDoc(collection(db,"results"),{quiz:id,owner:x.owner,score:n,total:tot,name:g("sn").value,phone:g("sp").value,email:g("se").value,at:Date.now()})}catch(e){}}}
async function admin(){if(!me||me.uid!==ADMIN_UID){v.innerHTML='<section class="nr"><h2>Admin only</h2><p>Log in with the admin account.</p></section>';return}
v.innerHTML=`<div class="w"><h2>Admin</h2><div class="c"><h3>Prices</h3><label>Notice shown on the pricing page</label><input id="an" value="${E(P.note)}"><div id="pe2"></div><button class="btn" id="sp2">Save prices</button><span id="sm" class="sm"></span></div><h3 style="margin-top:24px">Payments waiting</h3><div id="pw"></div></div>`;
g("pe2").innerHTML=P.plans.map((p,i)=>`<div class="c p" style="margin:10px 0"><div class="row"><div><label>Name</label><input id="pn${i}" value="${E(p.name)}"></div><div><label>Price (GHS)</label><input id="pc${i}" type="number" value="${E(p.price)}"></div><div><label>Courses (0 = unlimited)</label><input id="pl${i}" type="number" value="${E(p.limit)}"></div><div><label>Per</label><input id="pr${i}" value="${E(p.per)}"></div></div><label>Features (one per line)</label><textarea id="pf${i}" style="min-height:80px">${E(p.feat.join("\n"))}</textarea></div>`).join("");
g("sp2").onclick=async()=>{const pl=P.plans.map((p,i)=>({id:p.id,name:g("pn"+i).value,price:+g("pc"+i).value,limit:+g("pl"+i).value,per:g("pr"+i).value,feat:g("pf"+i).value.split("\n").map(s=>s.trim()).filter(Boolean)}));try{await setDoc(doc(db,"settings","prices"),{plans:pl,note:g("an").value});P={plans:pl,note:g("an").value};g("sm").textContent="Saved."}catch(e){g("sm").textContent=e.message}};
try{const s=await getDocs(query(collection(db,"payments"),where("status","==","pending")));
g("pw").innerHTML=s.docs.length?`<table>${s.docs.map(d=>{const p=d.data();return`<tr><td>${E(p.email)}<td>${E(p.plan)}<td>${E(p.txid)}<td>GHS ${E(p.amount)}<td><button class="btn s" data-a="${d.id}">Approve</button><button class="btn s o" data-r="${d.id}">Reject</button>`}).join("")}</table>`:"<p>No pending payments.</p>";
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const d=s.docs.find(x=>x.id==b.dataset.a),p=d.data(),m=+prompt("How many months did they pay for?","1");if(!m)return;const pl=P.plans.find(x=>x.id==p.plan)||{limit:1};await updateDoc(doc(db,"users",p.uid),{plan:p.plan,limit:pl.limit,until:Date.now()+m*30*864e5});await updateDoc(d.ref,{status:"approved"});admin()});
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"payments",b.dataset.r),{status:"rejected"});admin()})}catch(e){g("pw").textContent=e.message}}
const R={"":home,pricing,about,faq,contact,privacy,login,dash,admin};
function route(){const[p,a]=location.hash.slice(2).split("/");scrollTo(0,0);p=="q"?quiz(a):(R[p]||home)();rv()}
addEventListener("hashchange",route);
(async()=>{await loadP();if(ok)onAuthStateChanged(auth,async u=>{me=u;prof=null;if(u)try{const s=await getDoc(doc(db,"users",u.uid));prof=s.exists()?s.data():null}catch(e){}nav();route()});else{nav();route()}})();
</script></body></html>
